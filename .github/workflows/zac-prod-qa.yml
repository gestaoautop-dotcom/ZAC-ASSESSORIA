name: ZAC - verificacao da hospedagem em producao
on:
  push:
    branches: [main]
    paths:
      - "src/independent.js"
      - "wrangler.toml"
      - "site/**"
      - ".github/workflows/zac-prod-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verificar site principal e independencia
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://zacseguros.com.br"
          for n in $(seq 1 24); do
            curl -fsSL --max-time 30 "${BASE}/?zac_check=${GITHUB_RUN_ID}-${n}" -o /tmp/zac-home.html || true
            code=$(curl -sSL -o /dev/null -w "%{http_code}" -D /tmp/zac-headers.txt --max-time 30 "${BASE}/?zac_check=${GITHUB_RUN_ID}-${n}" || true)
            if [ "${code}" = 200 ] && grep -qi "x-zac-hosting: cloudflare-independent" /tmp/zac-headers.txt; then
              break
            fi
            echo "Attempt ${n}: HTTP ${code}, awaiting independent Cloudflare deployment"
            sleep 8
          done
          grep -qi "x-zac-hosting: cloudflare-independent" /tmp/zac-headers.txt
          grep -q "O corretor no centro" /tmp/zac-home.html
          ! grep -q "zac-assessoria.carolschimitez491.chatgpt.site" /tmp/zac-home.html
          echo "SUCCESS: independent Cloudflare site detected"
      - name: Conferir onze fotos, paginas e API
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://zacseguros.com.br"
          for i in $(seq -w 1 11); do
            grep -q "zac-evento-${i}.jpg" /tmp/zac-home.html
            status=$(curl -LsS -o /dev/null -w "%{http_code}" "${BASE}/images/galeria/eventos/zac-evento-${i}.jpg")
            test "${status}" = 200
          done
          for p in privacidade termos cookies acessibilidade obrigado; do
            status=$(curl -LsS -o /dev/null -w "%{http_code}" "${BASE}/${p}")
            echo "${p}: HTTP ${status}"
            test "${status}" = 200
          done
          invalid_status=$(curl -sS -o /tmp/zac-bad-lead.json -w "%{http_code}" -X POST \
            "${BASE}/api/leads" -H 'Content-Type: application/json' \
            --data '{"name":"Z","email":"invalid","phone":"0","consent":false}')
          test "${invalid_status}" = 400
          # Honeypot checks the D1 binding but does not persist personal data.
          hidden_status=$(curl -sS -o /tmp/zac-honeypot.json -w "%{http_code}" -X POST \
            "${BASE}/api/leads" -H 'Content-Type: application/json' \
            --data '{"website":"bot-trap","name":"Teste","email":"teste@example.invalid"}')
          test "${hidden_status}" = 200
          grep -q '"ok":true' /tmp/zac-honeypot.json
          echo "SUCCESS: production assets, pages and lead API checks passed."
