name: ZAC - capturar site original para hospedagem independente
on:
  push:
    branches: [staging/static-site-preview]
    paths:
      - "scripts/snapshot_zac.py"
      - "src/independent.js"
      - "wrangler.toml"
      - ".github/workflows/zac-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zac-independent-snapshot
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch de homologacao
        uses: actions/checkout@v4
        with:
          ref: staging/static-site-preview
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: python -m pip install requests beautifulsoup4
      - name: Buscar imagens do repositorio oficial sem converter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p galeria/eventos
          for n in $(seq -w 1 11); do
            curl --fail --location --retry 3 --silent --show-error \
              "https://raw.githubusercontent.com/gestaoautop-dotcom/ZAC-ASSESSORIA/main/galeria/eventos/zac-evento-${n}.jpg" \
              --output "galeria/eventos/zac-evento-${n}.jpg"
            test -s "galeria/eventos/zac-evento-${n}.jpg"
          done
      - name: Capturar site aprovado
        run: python scripts/snapshot_zac.py
      - name: Conferencia da independencia
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/privacidade/index.html
          test -s site/termos/index.html
          test -s site/cookies/index.html
          test -s site/acessibilidade/index.html
          test "$(find site/images/galeria/eventos -name 'zac-evento-*.jpg' | wc -l)" -eq 11
          ! grep -R -F "zac-assessoria.carolschimitez491.chatgpt.site" site --include="*.html"
          ! grep -R -F 'src="/images/galeria/zac-registro-' site/index.html
      - name: Versionar snapshot para Cloudflare Preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site
          if ! git diff --cached --quiet; then
            git commit -m "build: salvar snapshot autonomo do site ZAC para homologacao"
            git push origin HEAD:staging/static-site-preview
          fi
