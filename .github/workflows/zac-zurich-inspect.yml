name: ZAC - avaliar logo Zurich
on:
  push:
    branches: [main]
    paths: [".github/workflows/zac-zurich-inspect.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Avaliar distribuição do logotipo original
        run: python scripts/inspect_zurich.py
