name: ZAC - publicar logotipo Zurich sem Seguros
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zac-zurich-replace.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python -m pip install Pillow
      - name: Remover somente a palavra Seguros e redimensionar logo original
        run: python scripts/replace_zurich_logo.py
      - name: Verificar layout e publicar imagem no GitHub para Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          test -s site/images/parceiras/zurich-sem-seguros.jpg
          grep -q 'zurich-sem-seguros.jpg' site/index.html
          ! grep -q 'src="/images/parceiras/zurich.jpeg"' site/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/images/parceiras/zurich-sem-seguros.jpg site/index.html site/_next/static/chunks/
          if ! git diff --cached --quiet; then
            git commit -m "fix: substituir logotipo Zurich removendo Seguros sem alterar a seção"
            git push origin HEAD:main
          fi
